spring.application.name=TaskGoblin
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${TASK_GOBLIN_DB_URL:jdbc:h2:file:./data/taskgoblin;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${TASK_GOBLIN_DB_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
